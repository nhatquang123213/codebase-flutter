# Native splash for the "dev" flavor. Regenerate with: make splash
# Shown by the OS until the first Flutter frame; bootstrap() keeps it up until
# DI is ready via FlutterNativeSplash.preserve/remove.
flutter_native_splash:
  color: "#F97316"
  image: assets/branding/dev/splash.png
  android: true
  ios: true
  web: false
  # Android 12+ draws its own splash: centered icon on a solid color.
  android_12:
    color: "#F97316"
    image: assets/branding/dev/icon_foreground.png
