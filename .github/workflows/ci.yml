name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.38.9

jobs:
  # Same as `make check` locally, plus "is generated code committed?".
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          flutter gen-l10n
          make gen
          git diff --exit-code -- lib || {
            echo "::error::Generated files are stale. Run 'make l10n gen' and commit the result."
            exit 1
          }
      - run: make check

  # Guards the feature generator: scaffold a feature and make sure the
  # result formats, analyzes and tests clean.
  scaffold:
    name: Feature scaffold smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: make feature name=orders
      - run: make check

  # Guards the template rename: rename everything, then nothing may still
  # reference the template ids and the result must still pass make check.
  rename:
    name: Template rename smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: make rename name="Acme Shop" android_id=com.acme.shop_app
      - name: No template identifiers left behind
        run: |
          # Brackets keep this line itself from matching (and from being renamed).
          if git grep -n -I -i -e 'codebase[_]flutter' -e 'codebase[F]lutter' -e 'Codebase [D]ev' -e 'Codebase [F]lutter' -- . ':!README.md'; then
            echo "::error::rename left template identifiers behind"
            exit 1
          fi
          test -f android/app/src/main/kotlin/com/acme/shop_app/MainActivity.kt
      - run: make check

  build-android:
    name: Build Android (dev)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --flavor dev --dart-define-from-file=env/dev.json
      - uses: actions/upload-artifact@v7
        with:
          name: app-dev-debug.apk
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 7

  # connectivity_plus 7 uses iOS 26 APIs, so this needs Xcode 26+ (macos-26 image).
  # macOS minutes are expensive on private repos; delete this job (or gate it
  # on pushes to main) if the budget is tight.
  build-ios:
    name: Build iOS (dev, no codesign)
    runs-on: macos-26
    needs: check
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/cache@v6
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign --flavor dev --dart-define-from-file=env/dev.json
