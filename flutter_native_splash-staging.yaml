# Native splash for the "staging" flavor. Regenerate with: make splash
# Shown by the OS until the first Flutter frame; bootstrap() keeps it up until
# DI is ready via FlutterNativeSplash.preserve/remove.
flutter_native_splash:
  color: "#7C3AED"
  image: assets/branding/staging/splash.png
  android: true
  ios: true
  web: false
  # Android 12+ draws its own splash: centered icon on a solid color.
  android_12:
    color: "#7C3AED"
    image: assets/branding/staging/icon_foreground.png
